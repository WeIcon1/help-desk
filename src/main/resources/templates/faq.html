<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">База знаний</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Главная</a>
            <a class="nav-link" th:href="@{/contacts}">Контакты</a>
        </div>
    </div>
</nav>

<main class="container py-5">

    <h1 class="display-5 fw-bold mb-4">Часто задаваемые вопросы</h1>

    <div class="card shadow-sm mb-3" th:each="question : ${faqList}">
        <div class="card-body">
            <h4 th:text="${question}">Вопрос</h4>
        </div>
    </div>

    <a th:href="@{/}" class="btn btn-primary">Вернуться на главную</a>

</main>

</body>
</html>
